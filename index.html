<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <style>
        /* Impostazioni di base: Sfondo nero diretto e testo bianco */
        body {
            background-color: black;
            color: white; 
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 30px;
        }

        .button-container {
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }

        /* Colori esatti richiesti per i bottoni */
        .btn-ahyeon { background-color: #8A2BE2; } /* Viola */
        .btn-asa { background-color: #2E8B57; }    /* Verde */
        .btn-jennie { background-color: #1E90FF; } /* Blu */
    </style>
</head>
<body>

    <h1>Benvenuto nel mio sito web</h1>

    <div class="button-container">
        <!-- Bottoni con i collegamenti -->
        <button class="btn btn-ahyeon" onclick="location.href='ahyeon.html'">Ahyeon</button>
        <button class="btn btn-asa" onclick="location.href='asa.html'">Asa</button>
        <button class="btn btn-jennie" onclick="location.href='jennie.html'">Jennie</button>
    </div>

</body>
</html>
