<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <style>
        /* Sfondo nero fisso */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Animazione CSS per lo sfondo stellato/particelle */
        .animated-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: moveStars 10s linear infinite;
            opacity: 0.5;
        }

        @keyframes moveStars {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(-200px);
            }
        }

        h1 {
            color: white;
            z-index: 2;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .button-container {
            display: flex;
            gap: 20px;
            z-index: 2;
        }

        .btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }

        /* Colori dei bottoni richiesti */
        .btn-ahyeon {
            background-color: #8A2BE2; /* Viola */
        }

        .btn-asa {
            background-color: #2E8B57; /* Verde */
        }

        .btn-jennie {
            background-color: #1E90FF; /* Blu */
        }
    </style>
</head>
<body>

    <!-- Sfondo animato in CSS -->
    <div class="animated-bg"></div>

    <h1>Benvenuto nel mio sito web</h1>

    <div class="button-container">
        <button class="btn btn-ahyeon" onclick="location.href='ahyeon.html'">Ahyeon</button>
        <button class="btn btn-asa" onclick="location.href='asa.html'">Asa</button>
        <button class="btn btn-jennie" onclick="location.href='jennie.html'">Jennie</button>
    </div>

</body>
</html>
